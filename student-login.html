<!doctype html>
<html lang="ru" data-theme="dark" data-accent="blue">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход ученика · БитБлокнот</title>
  <script>try { var d = document.documentElement; d.dataset.theme = localStorage.getItem("bb-theme") || "dark"; d.dataset.accent = localStorage.getItem("bb-accent") || "blue"; } catch (e) {}</script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237aa7ff' stroke-width='2'%3E%3Cpath d='M6 4h11a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zM9 4v16M13 8h2M13 12h2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar"></header>
  <main class="wrap" id="main">
    <div class="login">
      <div class="center" style="margin-bottom:20px">
        <div class="logo"><i data-icon="notebook"></i> БитБлокнот</div>
        <div class="muted">Вход ученика</div>
      </div>
      <form class="card stack" id="form" novalidate autocomplete="off">
        <div class="field">
          <label class="muted small" for="class-code">Код класса — 6 цифр (его даёт учитель)</label>
          <input type="text" id="class-code" class="code-input" inputmode="numeric" maxlength="6" placeholder="000000" autofocus>
        </div>
        <div class="field">
          <label class="muted small" for="code">Твой личный код — 4 цифры</label>
          <input type="text" id="code" class="code-input" inputmode="numeric" maxlength="4" placeholder="0000">
        </div>
        <div class="error-text hidden" id="error"></div>
        <div class="feedback warn hidden" id="lock-box"><div class="fh"><i data-icon="clock"></i> Вход заблокирован на <span id="lock-left"></span> с</div>Это защита от подбора кодов.</div>
        <button class="btn primary block" type="submit" id="btn">Войти <i data-icon="arrow-right"></i></button>
      </form>
      <p class="center small muted" style="margin-top:14px">Забыл код? Посмотри карточку входа или спроси учителя.</p>
      <div id="demo"></div>
    </div>
  </main>
  <script type="module" src="js/pages/student-login.js"></script>
</body>
</html>
