<div class="widget">
  <div class="stage"><div class="flow" id="cd-row" style="gap:8px;min-height:120px"></div></div>
  <div class="controls">
    <input id="cd-in" type="text" maxlength="10" value="Кот" aria-label="Слово" style="width:170px">
    <div class="seg" id="cd-seg">
      <button type="button" data-e="1251" class="on">Windows-1251 · 8 бит</button>
      <button type="button" data-e="16">Unicode · 16 бит</button>
    </div>
  </div>
  <div id="cd-text" class="readout"></div>
  <div class="small muted hint">Каждый символ хранится как число — его код в кодовой таблице. Пробел и знаки препинания — тоже символы.</div>
</div>
<style>
  .cd-card { --c: var(--ac); width: 78px; border-radius: 10px; padding: 8px 4px; text-align: center; border: 2px solid var(--c); background: color-mix(in srgb, var(--c) 15%, var(--card)); }
  .cd-card b { display: block; font-size: 1.8rem; line-height: 1.1; color: var(--c); }
  .cd-card .mono { font-size: .8rem; }
  .cd-card .bits { font-size: .62rem; color: var(--mut); word-break: break-all; }
</style>
<script>
// Буквы-карточки: сверху символ, под ним код в таблице и двоичная запись.
function code1251(ch) {
  const c = ch.charCodeAt(0);
  if (c < 128) return c;
  if (c >= 0x410 && c <= 0x44f) return c - 0x410 + 192;
  if (ch === "Ё") return 168;
  if (ch === "ё") return 184;
  return 63;
}
const input = document.getElementById("cd-in"), row = document.getElementById("cd-row"), text = document.getElementById("cd-text");
let enc = "1251";
function build() {
  const bits = enc === "1251" ? 8 : 16;
  const items = [...input.value.slice(0, 10)].map(ch => {
    const code = enc === "1251" ? code1251(ch) : ch.codePointAt(0);
    return { ch, code, bin: code.toString(2).padStart(bits, "0") };
  });
  row.innerHTML = items.map((it, i) => `<div class="cd-card pop" style="--c: var(--c${(i % 6) + 1}); animation-delay:${i * 0.05}s">
    <b>${it.ch === " " ? "␣" : it.ch.replace(/[<>&]/g, "?")}</b><div class="mono">код ${it.code}</div><div class="mono bits">${it.bin}</div></div>`).join("");
  text.textContent = `${items.length} симв. × ${bits} бит = ${items.length * bits} бит = ${items.length * bits / 8} байт`;
}
input.addEventListener("input", build);
document.getElementById("cd-seg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  enc = b.dataset.e;
  document.querySelectorAll("#cd-seg button").forEach(x => x.classList.toggle("on", x === b));
  build();
});
build();
</script>
