<div class="widget">
  <div id="zp-scene"></div>
  <div class="controls">
    <label class="small muted">Пикселей по стороне
      <input id="zp-range" type="range" min="4" max="64" step="1" value="48">
    </label>
  </div>
  <div id="zp-text" class="readout"></div>
  <div class="small muted hint">Каждая плитка — один пиксель одного цвета. Чем меньше пикселей, тем грубее картинка.</div>
</div>
<script>
// Картинка «закат в горах» из плиток-пикселей. Ползунок меняет разрешение — плитки перестраиваются.
const src = document.createElement("canvas"); src.width = src.height = 128;
const q = src.getContext("2d");
const g = q.createLinearGradient(0, 0, 0, 128); g.addColorStop(0, "#1e3a8a"); g.addColorStop(1, "#f97316");
q.fillStyle = g; q.fillRect(0, 0, 128, 128);
q.fillStyle = "#fde68a"; q.beginPath(); q.arc(90, 44, 17, 0, 7); q.fill();
q.fillStyle = "#0f172a"; q.beginPath(); q.moveTo(0, 128); q.lineTo(38, 70); q.lineTo(70, 108); q.lineTo(96, 76); q.lineTo(128, 128); q.fill();
const small = document.createElement("canvas"), sx = small.getContext("2d", { willReadFrequently: true });
const range = document.getElementById("zp-range"), text = document.getElementById("zp-text");

BB.three(document.getElementById("zp-scene"), { height: 300, camera: [0, -2.2, 13], fov: 38 }).then(k => {
  const update = () => {
    const n = +range.value;
    text.textContent = n + " × " + n + " = " + (n * n).toLocaleString("ru-RU") + " пикселей";
  };
  range.addEventListener("input", update); update();
  if (!k) return;
  const { THREE, scene } = k;
  const S = 7.2;                       // сторона картинки в единицах сцены
  const group = new THREE.Group(); scene.add(group);
  let mesh = null, born = 0;
  const geo = new THREE.BoxGeometry(1, 1, 1);
  const m4 = new THREE.Matrix4(), col = new THREE.Color();
  let tiles = [];

  function build() {
    const n = +range.value;
    small.width = small.height = n; sx.imageSmoothingEnabled = true; sx.drawImage(src, 0, 0, n, n);
    const data = sx.getImageData(0, 0, n, n).data;
    if (mesh) { group.remove(mesh); mesh.material.dispose(); mesh.dispose(); }
    mesh = new THREE.InstancedMesh(geo, new THREE.MeshStandardMaterial({ roughness: 0.6 }), n * n);
    const cell = S / n;
    tiles = [];
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const i = y * n + x, p = i * 4;
      col.setRGB(data[p] / 255, data[p + 1] / 255, data[p + 2] / 255, THREE.SRGBColorSpace);
      mesh.setColorAt(i, col);
      const bright = (data[p] + data[p + 1] + data[p + 2]) / 765;
      tiles.push({ x: -S / 2 + cell * (x + 0.5), y: S / 2 - cell * (y + 0.5), s: cell * 0.9, d: cell * (0.3 + bright * 0.9), delay: Math.random() * 0.35 });
    }
    group.add(mesh);
    born = 0;
    place(0);
  }
  function place(t) {
    tiles.forEach((tl, i) => {
      const k2 = k.reduced ? 1 : Math.min(1, Math.max(0, (t - tl.delay) / 0.45));
      const e = 1 - Math.pow(1 - k2, 3);
      m4.makeScale(tl.s, tl.s, tl.d * e + 0.001);
      m4.setPosition(tl.x, tl.y, (1 - e) * 2.5 + tl.d * e / 2);
      mesh.setMatrixAt(i, m4);
    });
    mesh.instanceMatrix.needsUpdate = true;
  }
  let timer = 0;
  range.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(build, 60); });
  build();
  k.onFrame((dt, t) => {
    if (born < 1) { born += dt; place(born); }
    group.rotation.y = k.reduced ? 0.25 : Math.sin(t * 0.5) * 0.35;
    group.rotation.x = -0.15;
  });
});
</script>
