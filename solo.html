<!doctype html>
<html lang="ru" data-theme="dark" data-accent="blue">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Учиться самостоятельно · БитБлокнот</title>
  <script>try { var d = document.documentElement; d.dataset.theme = localStorage.getItem("bb-theme") || "dark"; d.dataset.accent = localStorage.getItem("bb-accent") || "blue"; } catch (e) {}</script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237aa7ff' stroke-width='2'%3E%3Cpath d='M6 4h11a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zM9 4v16M13 8h2M13 12h2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/lesson.css">
</head>
<body class="app">
  <header id="topbar"></header>
  <main class="wrap" id="main">
    <div class="login">
      <div class="center" style="margin-bottom:20px">
        <div class="logo"><i data-icon="notebook"></i> БитБлокнот</div>
        <div class="muted">Учиться самостоятельно — без класса и учителя</div>
      </div>
      <div id="continue"></div>
      <form class="card stack" id="form" novalidate autocomplete="off">
        <div class="field">
          <label class="muted small" for="name">Как тебя зовут?</label>
          <input type="text" id="name" maxlength="40" placeholder="Например, Петя" autofocus>
        </div>
        <div class="error-text hidden" id="error"></div>
        <button class="btn primary block" type="submit" id="btn">Начать учиться <i data-icon="arrow-right"></i></button>
      </form>
      <div class="card stack" style="margin-top:14px">
        <div class="small muted"><i data-icon="info"></i> Прогресс хранится только в этом браузере. Чтобы продолжить на другом компьютере,
          скачай копию и загрузи её там. Если учитель дал тебе коды класса — лучше <a href="student-login.html">войти по кодам</a>.</div>
        <div class="row" style="gap:8px;flex-wrap:wrap">
          <button class="btn small" type="button" id="export"><i data-icon="save"></i> Скачать копию прогресса</button>
          <label class="btn small" for="import-file" style="cursor:pointer"><i data-icon="folder"></i> Загрузить копию</label>
          <input type="file" id="import-file" accept=".json,application/json" hidden>
        </div>
        <div class="error-text hidden" id="import-error"></div>
      </div>
    </div>
  </main>
  <script type="module" src="js/pages/solo.js"></script>
</body>
</html>
