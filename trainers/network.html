<div class="seg" id="nw-tabs" style="margin-bottom:12px">
  <button type="button" data-t="route" class="on">Почтальон пакетов</button>
  <button type="button" data-t="url">Разбери адрес</button>
</div>
<div class="flow small" style="margin-bottom:10px"><span class="chip" id="nw-p1" style="--c: var(--c1)"></span><span class="chip" id="nw-p2" style="--c: var(--c5)"></span></div>

<div data-nw="route">
  <p class="muted small">Проложи путь пакета от отправителя к получателю: нажимай на маршрутизаторы по очереди. Красные пунктирные линии оборваны — по ним ехать нельзя.</p>
  <div class="stage"><svg id="nw-svg" viewBox="0 0 640 280"></svg></div>
  <div class="row" style="margin-top:8px;justify-content:center"><button class="btn small" type="button" id="nw-undo">Отменить шаг</button></div>
</div>

<div data-nw="url" class="hidden">
  <p class="muted small">Нажми на часть адреса, потом на её название. Разбери 3 адреса.</p>
  <div class="stage">
    <div class="flow" id="nw-parts" style="gap:4px"></div>
    <div class="flow" id="nw-names" style="gap:6px;margin-top:14px"></div>
  </div>
</div>
<div class="feedback hidden" id="nw-fb"></div>

<script>
const $ = id => document.getElementById(id);
let delivered = 0, parsed = 0;
function progress() {
  $("nw-p1").textContent = `доставлено сообщений: ${Math.min(delivered, 3)} из 3`;
  $("nw-p2").textContent = `разобрано адресов: ${Math.min(parsed, 3)} из 3`;
  if (delivered >= 3 && parsed >= 3) BB.trainerDone();
}
$("nw-tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  $("nw-tabs").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll("[data-nw]").forEach(p => p.classList.toggle("hidden", p.dataset.nw !== b.dataset.t));
  $("nw-fb").className = "feedback hidden";
});

// ---------- маршрут ----------
const P = [[50, 140], [170, 50], [170, 230], [320, 30], [320, 140], [320, 250], [470, 60], [470, 220], [590, 140]];
const E = [[0, 1], [0, 2], [1, 3], [1, 4], [2, 4], [2, 5], [3, 6], [4, 6], [4, 7], [5, 7], [6, 8], [7, 8], [3, 4], [4, 5], [1, 2], [6, 7]];
const NS = "http://www.w3.org/2000/svg", svg = $("nw-svg");
let broken = new Set(), path = [0];
const key = (a, b) => a < b ? `${a}-${b}` : `${b}-${a}`;
function reachable() {
  const seen = new Set([0]), st = [0];
  while (st.length) { const v = st.pop(); E.forEach(([a, b]) => { if (broken.has(key(a, b))) return; const w = a === v ? b : b === v ? a : -1; if (w >= 0 && !seen.has(w)) { seen.add(w); st.push(w); } }); }
  return seen.has(8);
}
function newRound() {
  do {
    broken = new Set();
    const inner = E.filter(([a, b]) => a && b !== 8);
    while (broken.size < 4) { const [a, b] = inner[Math.floor(Math.random() * inner.length)]; broken.add(key(a, b)); }
  } while (!reachable());
  path = [0]; draw();
}
function draw() {
  let s = "";
  E.forEach(([a, b]) => {
    const br = broken.has(key(a, b));
    s += `<line x1="${P[a][0]}" y1="${P[a][1]}" x2="${P[b][0]}" y2="${P[b][1]}" stroke="${br ? "var(--err)" : "var(--line)"}" stroke-width="5" stroke-linecap="round" ${br ? 'stroke-dasharray="6 9"' : ""}/>`;
  });
  for (let i = 1; i < path.length; i++) {
    const a = P[path[i - 1]], b = P[path[i]];
    s += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="var(--c${(i % 6) + 1})" stroke-width="8" stroke-linecap="round"/>`;
  }
  P.forEach(([x, y], i) => {
    const end = i === 0 || i === 8, on = path.includes(i), last = path[path.length - 1] === i;
    const c = i === 0 ? "--c1" : i === 8 ? "--c2" : "--c6";
    s += `<g data-n="${i}" style="cursor:pointer" transform="translate(${x} ${y})">` +
      (end ? `<rect x="-36" y="-22" width="72" height="44" rx="10" fill="color-mix(in srgb, var(${c}) ${on ? 60 : 25}%, var(--card))" stroke="var(${c})" stroke-width="3"/>
              <text y="5" text-anchor="middle" font-size="13" font-weight="700">${i ? "Получатель" : "Отправитель"}</text>`
           : `<circle r="${last ? 22 : 18}" fill="color-mix(in srgb, var(${c}) ${on ? 70 : 22}%, var(--card))" stroke="var(${c})" stroke-width="3"/>
              <text y="5" text-anchor="middle" font-size="13" font-weight="700">${i}</text>`) + "</g>";
  });
  const last = P[path[path.length - 1]];
  s += `<g transform="translate(${last[0]} ${last[1] - 34})"><rect x="-22" y="-12" width="44" height="24" rx="6" fill="var(--c3)"/><text y="5" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--on-c)">пакет</text></g>`;
  svg.innerHTML = s;
}
svg.addEventListener("click", e => {
  const g = e.target.closest("[data-n]"); if (!g) return;
  const n = +g.dataset.n, cur = path[path.length - 1];
  const edge = E.find(([a, b]) => key(a, b) === key(cur, n));
  if (!edge) { BB.feedback($("nw-fb"), "warn", "Туда нет прямой линии. Выбери соседний маршрутизатор."); return; }
  if (broken.has(key(cur, n))) { BB.feedback($("nw-fb"), "bad", "Эта линия оборвана! Найди обход."); return; }
  if (path.includes(n)) { BB.feedback($("nw-fb"), "warn", "Здесь пакет уже был — так он будет ходить по кругу."); return; }
  path.push(n); draw();
  if (n === 8) {
    delivered++; progress();
    BB.feedback($("nw-fb"), "ok", `<div class="fh">Доставлено!</div>Путь: ${path.map(v => v === 0 ? "отправитель" : v === 8 ? "получатель" : v).join(" → ")}. Маршрутизаторы передают пакет от одного к другому, обходя поломки.`);
    setTimeout(newRound, 1400);
  } else $("nw-fb").className = "feedback hidden";
});
$("nw-undo").onclick = () => { if (path.length > 1) { path.pop(); draw(); } };

// ---------- разбор адреса ----------
const URLS = [
  ["https", "zoo.ru", "/animals/", "cat.html"], ["http", "school.ru", "/news/", "day.html"], ["https", "maps.city.ru", "/park/", "map.png"],
  ["https", "music.net", "/rock/", "song.mp3"], ["http", "games.org", "/chess/", "rules.txt"], ["https", "lib.ru", "/books/", "tale.pdf"],
];
const NAMES = ["протокол", "имя сервера", "папка", "имя файла"];
let url = null, done = [], pickedPart = null, deck = [];
function newUrl() {
  if (!deck.length) deck = URLS.map((_, i) => i).sort(() => Math.random() - 0.5);
  url = URLS[deck.pop()]; done = []; pickedPart = null;
  const order = [0, 1, 2, 3].sort(() => Math.random() - 0.5);
  $("nw-parts").innerHTML = `<span class="mono muted">${url[0]}://${url[1]}${url[2]}${url[3]}</span>`;
  $("nw-names").innerHTML = "";
  $("nw-parts").insertAdjacentHTML("beforeend", "<div style='flex-basis:100%;height:6px'></div>" + order.map(i => `<button type="button" class="tile pop mono" style="--c: var(--c${i + 1})" data-p="${i}">${url[i]}</button>`).join(""));
  $("nw-names").innerHTML = NAMES.map((n, i) => `<button type="button" class="tile" style="--c: var(--mut)" data-n="${i}">${n}</button>`).join("");
}
$("nw-parts").addEventListener("click", e => {
  const t = e.target.closest("[data-p]"); if (!t || done.includes(+t.dataset.p)) return;
  pickedPart = t;
  $("nw-parts").querySelectorAll("[data-p]").forEach(x => x.classList.toggle("picked", x === t));
});
$("nw-names").addEventListener("click", e => {
  const t = e.target.closest("[data-n]"); if (!t || !pickedPart) return;
  const p = +pickedPart.dataset.p, n = +t.dataset.n;
  if (p === n) {
    done.push(p);
    t.style.setProperty("--c", `var(--c${p + 1})`); t.classList.add("on"); t.textContent = `${NAMES[n]}: ${url[p]}`;
    pickedPart.classList.remove("picked"); pickedPart.classList.add("dim"); pickedPart = null;
    if (done.length === 4) {
      parsed++; progress();
      BB.feedback($("nw-fb"), "ok", `<div class="fh">Адрес разобран!</div>Протокол → имя сервера → папка → файл.`);
      setTimeout(newUrl, 1300);
    } else $("nw-fb").className = "feedback hidden";
  } else {
    t.classList.remove("shake"); void t.offsetWidth; t.classList.add("shake");
    BB.feedback($("nw-fb"), "bad", `«${url[p]}» — это не ${NAMES[n]}. Подсказка: протокол стоит перед ://, имя сервера — сразу после.`);
  }
});
newRound(); newUrl(); progress();
</script>
