<div class="card">
  <div class="spread">
    <h1 class="step-title" style="margin:0">{{ icon('flask') }} Тренажёр</h1>
    {% if s.trainer_done %}<span class="badge ac">{{ icon('check') }} задание выполнено</span>{% endif %}
  </div>
  <div id="trainer" data-topic="{{ t.num }}" data-done-url="{{ url_for('api_trainer_done', num=t.num) }}" style="margin-top:12px">
    {% include ["trainers/" ~ t.trainer ~ ".html", "trainers/_soon.html"] %}
  </div>
  <div class="spread" style="margin-top:16px">
    <a class="btn" href="{{ url_for('topic', num=t.num, stage='step', i=lesson.steps|length - 1) }}">{{ icon('arrow-left') }} К уроку</a>
    <a class="btn primary" href="{{ url_for('topic', num=t.num, stage='tasks' if t.generator else 'test') }}">
      {{ 'К задачам' if t.generator else 'К тесту' }} {{ icon('arrow-right') }}
    </a>
  </div>
</div>
<script src="{{ url_for('static', filename='js/trainer-common.js') }}"></script>
