{% for q in questions %}
<div class="card test-q" style="background:var(--card-2)">
  <div class="qn">Вопрос {{ loop.index }}</div>
  <div style="margin:4px 0 10px">{{ q.text|safe }}</div>
  {% if q.kind == 'choice' %}
    <div class="row">
      {% for o in q.options %}
      <label class="choice"><input type="radio" name="{{ q.id }}" value="{{ o }}" required style="margin-right:6px">{{ o|safe }}</label>
      {% endfor %}
    </div>
  {% else %}
    <div class="row">
      <input type="{{ 'text' }}" name="{{ q.id }}" required inputmode="{{ 'decimal' if q.kind == 'number' else 'text' }}"
             placeholder="{{ 'Ответ' if q.kind == 'number' else (q.placeholder or 'Ответ') }}"
             style="{{ 'width:160px' if q.kind == 'number' else 'width:min(420px,100%)' }}">
      <span class="muted">{{ q.unit }}</span>
    </div>
  {% endif %}
</div>
{% endfor %}
